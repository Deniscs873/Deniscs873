name: Generate contribution snake

on:
  schedule:
    # Twice daily (UTC), rather than every minute during two hours.
    - cron: "0 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Update contribution SVG
    runs-on: ubuntu-latest
    steps:
      - name: Generate SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Deniscs873
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Publish output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
